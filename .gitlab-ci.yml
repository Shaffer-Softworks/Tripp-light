variables:
  GITHUB_REPOSITORY: "Shaffer-Softworks/Tripp-light"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

default:
  tags:
    - docker

stages:
  - notify_start
  - lint
  - validate
  - release
  - notify_finish

.github_status:
  image: curlimages/curl:8.10.1
  allow_failure: true
  script:
    - |
      if [ -z "${GITHUB_TOKEN:-}" ]; then
        echo "GITHUB_TOKEN is not set; skipping GitHub commit status update."
        exit 0
      fi

      curl --fail-with-body --request POST \
        --header "Authorization: Bearer ${GITHUB_TOKEN}" \
        --header "Accept: application/vnd.github+json" \
        --header "X-GitHub-Api-Version: 2022-11-28" \
        --data "{\"state\":\"${GITHUB_STATUS_STATE}\",\"target_url\":\"${CI_PIPELINE_URL}\",\"description\":\"${GITHUB_STATUS_DESCRIPTION}\",\"context\":\"gitlab-ci/pipeline\"}" \
        "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${CI_COMMIT_SHA}"

github_status_pending:
  extends: .github_status
  stage: notify_start
  variables:
    GITHUB_STATUS_STATE: pending
    GITHUB_STATUS_DESCRIPTION: "GitLab pipeline is running"

lint:
  image: python:3.11-slim
  stage: lint
  cache:
    key: pip
    paths:
      - .cache/pip
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install black isort flake8 mypy
  script:
    - isort --check-only custom_components
    - flake8 custom_components
    - mypy custom_components

# Run Docker inside the job container (not docker:dind as a service).
# Avoids service DNS failures (lookup docker on 127.0.0.11:53) seen with
# FF_NETWORK_PER_BUILD. Requires the runner to allow privileged jobs.
.docker_validation:
  image: docker:27-dind
  stage: validate
  privileged: true
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - |
      for attempt in $(seq 1 30); do
        if docker info >/dev/null 2>&1; then
          docker version
          exit 0
        fi

        echo "Waiting for Docker daemon (${attempt}/30)..."
        sleep 1
      done

      echo "Docker daemon did not become ready in time."
      docker info
      exit 1

hassfest:
  extends: .docker_validation
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/github/workspace" ghcr.io/home-assistant/hassfest

hacs:
  extends: .docker_validation
  script:
    - |
      docker run --rm \
        -e "INPUT_CATEGORY=integration" \
        -e "INPUT_REPOSITORY=${GITHUB_REPOSITORY}" \
        -e "INPUT_COMMENT=false" \
        -e "INPUT_GITHUB_TOKEN=${GITHUB_TOKEN:-}" \
        -v "$CI_PROJECT_DIR:/github/workspace" \
        ghcr.io/hacs/action:main

github_release:
  image: alpine:3.20
  stage: release
  rules:
    - if: "$CI_COMMIT_TAG"
  before_script:
    - apk add --no-cache curl jq zip
  script:
    - |
      if [ -z "${GITHUB_TOKEN:-}" ]; then
        echo "GITHUB_TOKEN is required to create or update GitHub releases."
        exit 1
      fi

      ZIP="tripp_lite_srcool.zip"
      TAG="${CI_COMMIT_TAG}"
      API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
      AUTH_HEADER="Authorization: Bearer ${GITHUB_TOKEN}"

      rm -f "$ZIP"
      (
        cd custom_components/tripp_lite_srcool
        zip -r "../../${ZIP}" . -x "*__pycache__/*" -x "*.pyc"
      )

      status=$(curl --silent --show-error --output release.json --write-out "%{http_code}" \
        --header "$AUTH_HEADER" \
        --header "Accept: application/vnd.github+json" \
        --header "X-GitHub-Api-Version: 2022-11-28" \
        "${API}/releases/tags/${TAG}")

      if [ "$status" = "404" ]; then
        jq -n \
          --arg tag "$TAG" \
          --arg sha "$CI_COMMIT_SHA" \
          '{tag_name:$tag,name:$tag,target_commitish:$sha,generate_release_notes:true}' > create-release.json
        curl --fail-with-body --request POST \
          --header "$AUTH_HEADER" \
          --header "Accept: application/vnd.github+json" \
          --header "X-GitHub-Api-Version: 2022-11-28" \
          --data @create-release.json \
          "${API}/releases" > release.json
      elif [ "$status" != "200" ]; then
        cat release.json
        exit 1
      fi

      asset_id=$(jq -r --arg name "$ZIP" '.assets[]? | select(.name == $name) | .id' release.json | head -n 1)
      if [ -n "$asset_id" ]; then
        curl --fail-with-body --request DELETE \
          --header "$AUTH_HEADER" \
          --header "Accept: application/vnd.github+json" \
          --header "X-GitHub-Api-Version: 2022-11-28" \
          "${API}/releases/assets/${asset_id}"
      fi

      upload_url=$(jq -r '.upload_url | sub("\\{\\?name,label\\}$"; "")' release.json)
      curl --fail-with-body --request POST \
        --header "$AUTH_HEADER" \
        --header "Accept: application/vnd.github+json" \
        --header "X-GitHub-Api-Version: 2022-11-28" \
        --header "Content-Type: application/zip" \
        --data-binary "@${ZIP}" \
        "${upload_url}?name=${ZIP}"

github_status_success:
  extends: .github_status
  stage: notify_finish
  when: on_success
  variables:
    GITHUB_STATUS_STATE: success
    GITHUB_STATUS_DESCRIPTION: "GitLab pipeline passed"

github_status_failure:
  extends: .github_status
  stage: notify_finish
  when: on_failure
  variables:
    GITHUB_STATUS_STATE: failure
    GITHUB_STATUS_DESCRIPTION: "GitLab pipeline failed"
